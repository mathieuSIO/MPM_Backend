services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpm_backend
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mpm_network

  postgres:
    image: postgres:16
    container_name: mpm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mpm_network

volumes:
  postgres_data_prod:
  uploads_data:

networks:
  mpm_network:
    name: mpm_network